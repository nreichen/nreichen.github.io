<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nathan·reichen</title>
    <!-- Tab icon: the SVG switches to white when the browser is in dark mode;
         favicon.ico is the fallback, apple-touch-icon for iPhone home screens -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.ico" sizes="48x48">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preload" href="fonts/cousine-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <script>
        // Apply a light/dark choice saved by the moon button before the page
        // draws, so it doesn't flash the other version first
        try {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                document.documentElement.dataset.theme = savedTheme;
            }
        } catch (e) {}
    </script>
    <style>
        /* Title font, bundled with the site so every visitor sees the same
           one (Cousine, SIL Open Font License: fonts/cousine-OFL.txt) */
        @font-face {
            font-family: 'Cousine';
            src: url('fonts/cousine-latin-400-normal.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        /* Light and dark versions of the site. The visitor's device setting
           picks one until they choose with the moon button, which sets
           data-theme on <html>. Each has its own background picture and
           text color. */
        :root {
            --background-image: url('images/background-light.jpg');
            --background-color: white;
            --text-color: #111;
            --icon-shadow: rgba(255, 255, 255, 0.6);
        }

        /* Dark when the device is in dark mode, unless the visitor chose light */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --background-image: url('images/background-dark.jpg');
                --background-color: #222;
                --text-color: white;
                --icon-shadow: rgba(0, 0, 0, 0.5);
            }
        }

        /* Dark when the visitor chose it with the moon button */
        :root[data-theme="dark"] {
            --background-image: url('images/background-dark.jpg');
            --background-color: #222;
            --text-color: white;
            --icon-shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            overflow-x: hidden;
        }

        /* Site-wide background picture (light or dark, set above), fixed in
           place on every page and screen size. A fixed layer is used instead
           of background-attachment: fixed, which iPhones ignore. */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            /* 35% across keeps the mountain's main peak in view on narrow
               screens; wide screens show the picture's full width anyway */
            background: var(--background-image) 35% center / cover no-repeat;
        }

        /* Menu and night mode buttons: same size, color and shadow */
        .icon-button {
            position: fixed;
            top: 20px;
            width: 40px;
            height: 40px;
            box-sizing: border-box;
            padding: 6px;
            border: 0;
            background: none;
            color: var(--text-color);
            cursor: pointer;
            z-index: 1000;
            /* Keeps the icons visible when they pass over a photo */
            filter: drop-shadow(0 1px 2px var(--icon-shadow));
        }

        .icon-button svg {
            display: block;
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .menu-icon {
            left: 20px;
            transition: transform 0.3s ease;
        }

        .menu-icon.open {
            transform: rotate(90deg);
        }

        .theme-toggle {
            right: 20px;
        }

        /* Logos (title, menu, moon) each have two drawings stacked in the same
           spot; the script swaps which one shows at random intervals */
        .logo {
            display: grid;
            place-items: center;
        }

        .icon-button.logo {
            grid-template: 100% / 100%;
        }

        .logo-frame {
            grid-area: 1 / 1;
        }

        .logo:not(.show-alt) > .logo-frame:nth-child(2),
        .logo.show-alt > .logo-frame:nth-child(1) {
            visibility: hidden;
        }

        .header-container {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
        }

        /* Site title (placeholder: the same name in two fonts; the first,
           Cousine, shows until the dot is clicked) */
        .site-title {
            margin: 0;
            height: 40px; /* Same height as the icons */
            font-size: 26px;
            font-weight: normal;
            line-height: 40px;
            white-space: nowrap;
            color: var(--text-color);
            text-shadow: 0 1px 2px var(--icon-shadow);
        }

        .title-font-a {
            font-family: Cousine, 'Liberation Mono', 'Courier New', monospace;
        }

        .title-font-b {
            font-family: Georgia, 'Times New Roman', serif;
        }

        /* Clicking the dot starts and stops the title swapping. The padding
           (cancelled out by the negative margin) makes it easier to hit. */
        .title-dot {
            cursor: pointer;
            padding: 10px 6px;
            margin: -10px -6px;
        }

        /* Sidebar menu: no panel, just links over the background */
        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            transition: left 0.3s ease;
            z-index: 900;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-content {
            padding: 80px 20px 20px;
        }

        .sidebar-link {
            display: block;
            margin-bottom: 15px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 18px;
            /* Keeps the links readable over photos */
            text-shadow: 0 1px 2px var(--icon-shadow);
            transition: opacity 0.2s;
        }

        .sidebar-link:hover {
            opacity: 0.6;
        }

        /* Film page (photo gallery) */
        .gallery-page {
            /* Same space between photos as between photos and the screen edges */
            --photo-spacing: 20px;
            width: 100%;
            box-sizing: border-box;
            padding: 100px var(--photo-spacing) var(--photo-spacing);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--photo-spacing);
        }

        /* Square cells so vertical and horizontal photos show at the same
           size: each photo's long edge fills the cell, uncropped and centered */
        .photo {
            margin: 0;
            aspect-ratio: 1 / 1;
            display: grid;
            place-items: center;
            background-color: #f2f2f2;
        }

        .photo.loaded {
            background-color: transparent;
        }

        /* Wraps the image tightly so the caption sits on the photo itself */
        .photo-frame {
            position: relative;
            overflow: hidden;
        }

        .photo img,
        .photo video {
            display: block;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.4s ease;
            /* No dragging photos out, and no iPhone long-press "Save to
               Photos" menu (see the contextmenu handler in the script) */
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .photo.loaded img,
        .photo.loaded video {
            opacity: 1;
        }

        .photo figcaption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 24px 12px 10px;
            color: white;
            font-size: 14px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .photo:hover figcaption,
        .photo:focus-visible figcaption,
        .photo.show-caption figcaption {
            opacity: 1;
        }

        .gallery-empty {
            color: var(--text-color);
            text-align: center;
        }

        /* Super 8 page: one YouTube project per row, centered, each with a
           title, a paragraph and a link to watch it on YouTube */
        .video-page {
            width: 100%;
            max-width: 960px;
            box-sizing: border-box;
            padding: 100px 20px 40px;
        }

        .video-project {
            margin: 0 0 96px;
            text-align: center;
            color: var(--text-color);
            /* Keeps the text readable over the background picture */
            text-shadow: 0 1px 2px var(--icon-shadow);
        }

        .video-frame {
            position: relative;
            aspect-ratio: 16 / 9;
            background-color: #000;
        }

        .video-frame iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-project h2 {
            margin: 28px 0 4px;
            font-family: Cousine, 'Liberation Mono', 'Courier New', monospace;
            font-size: 22px;
            font-weight: normal;
        }

        .video-when {
            margin: 0;
            font-size: 14px;
            opacity: 0.75;
        }

        .video-blurb p {
            max-width: 640px;
            margin: 16px auto 0;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <!-- The title, menu, and moon are "logos": each holds two drawings that
         swap at random so hand-drawn versions look alive. These are
         placeholders; to use drawings, replace each pair with two <img>s
         that keep the class="logo-frame". -->

    <!-- Night mode toggle in the top right -->
    <button id="themeToggle" class="icon-button theme-toggle logo" type="button" aria-label="Night mode" aria-pressed="false">
        <svg class="logo-frame" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="logo-frame" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" transform="rotate(-12 12 12)"/></svg>
    </button>

    <!-- Menu button in the top left -->
    <button id="menuIcon" class="icon-button menu-icon logo" type="button" aria-label="Menu" aria-expanded="false">
        <svg class="logo-frame" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <svg class="logo-frame" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h17M2.5 12h18.5M4 17.5h16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    </button>

    <!-- Site title -->
    <div class="header-container">
        <h1 class="site-title logo" data-swap="click">
            <span class="logo-frame title-font-a">nathan<span class="title-dot">·</span>reichen</span>
            <span class="logo-frame title-font-b">nathan<span class="title-dot">·</span>reichen</span>
        </h1>
    </div>

    <!-- Sidebar menu -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-content">
            <a href="#film" class="sidebar-link">Film</a>
            <a href="#super8" class="sidebar-link">Super 8</a>
        </div>
    </nav>

    <!-- Film photos page: the home page for now, and #film -->
    <main id="film" class="gallery-page" hidden>
        <div id="photoGrid" class="photo-grid"></div>
        <div id="gallerySentinel"></div>
    </main>

    <!-- Super 8 page (YouTube projects), shown when the URL ends in #super8 -->
    <main id="super8" class="video-page" hidden>
        <div id="videoList"></div>
    </main>

    <!-- List of film photos; edit photos.js to add more -->
    <script src="photos.js"></script>
    <!-- List of Super 8 projects; edit super8.js to add more -->
    <script src="super8.js"></script>
    <script>
        let isSidebarOpen = false;
        const menuIconElement = document.getElementById('menuIcon');
        const sidebarElement = document.getElementById('sidebar');

        // Function to toggle sidebar
        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            menuIconElement.setAttribute('aria-expanded', isSidebarOpen);
            if (isSidebarOpen) {
                sidebarElement.classList.add('open');
                menuIconElement.classList.add('open');
            } else {
                sidebarElement.classList.remove('open');
                menuIconElement.classList.remove('open');
            }
        }

        // Add click event listener to menu icon
        menuIconElement.addEventListener('click', toggleSidebar);

        // Close the sidebar after picking a page
        document.querySelectorAll('.sidebar-link').forEach(function(link) {
            link.addEventListener('click', function() {
                if (isSidebarOpen) toggleSidebar();
            });
        });

        // ---- Night mode toggle ----
        const themeToggleElement = document.getElementById('themeToggle');
        const deviceDarkQuery = window.matchMedia('(prefers-color-scheme: dark)');

        // The visitor's choice wins; otherwise follow the device setting
        function isDarkMode() {
            const chosenTheme = document.documentElement.dataset.theme;
            return chosenTheme ? chosenTheme === 'dark' : deviceDarkQuery.matches;
        }

        function updateThemeToggle() {
            themeToggleElement.setAttribute('aria-pressed', isDarkMode());
        }

        themeToggleElement.addEventListener('click', function() {
            const newTheme = isDarkMode() ? 'light' : 'dark';
            document.documentElement.dataset.theme = newTheme;
            try {
                localStorage.setItem('theme', newTheme);
            } catch (e) {}
            updateThemeToggle();
        });

        deviceDarkQuery.addEventListener('change', updateThemeToggle);
        updateThemeToggle();

        // Visitors who ask their device to reduce motion get still logos and
        // clips that only play when tapped
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ---- Film page (photo gallery) ----
        const photos = window.PHOTOS || [];
        const PHOTOS_PER_BATCH = 8;
        const filmElement = document.getElementById('film');
        const photoGridElement = document.getElementById('photoGrid');
        const sentinelElement = document.getElementById('gallerySentinel');
        let photosShown = 0;
        let galleryStarted = false;
        let galleryObserver = null;

        // e.g. "Fall 2024 · Ann Arbor, MI", or "Fall 2024" with no location
        function captionFor(photo) {
            const when = [photo.season, photo.year].filter(Boolean).join(' ');
            return [when, photo.location].filter(Boolean).join(' · ');
        }

        // Clips (the RETO 3D loops) play like GIFs, but only while on screen
        const clipObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.play().catch(function() {});
                } else {
                    entry.target.pause();
                }
            });
        }, { threshold: 0.25 });

        function isClip(photo) {
            return /\.(mp4|webm|mov)$/i.test(photo.src);
        }

        function createPhotoElement(photo) {
            const caption = captionFor(photo);
            const label = caption ? 'Film photograph, ' + caption : 'Film photograph';
            const clip = isClip(photo);
            const figure = document.createElement('figure');
            figure.className = 'photo';
            figure.tabIndex = 0;
            const frame = document.createElement('div');
            frame.className = 'photo-frame';

            // Size the frame to the media's proportions, long edge filling the cell
            function showMedia(width, height) {
                frame.style.aspectRatio = width + ' / ' + height;
                if (width >= height) {
                    frame.style.width = '100%';
                } else {
                    frame.style.height = '100%';
                }
                figure.classList.add('loaded');
            }

            let media;
            if (clip) {
                media = document.createElement('video');
                // iPhones only play inline, without a tap, when these are attributes
                media.muted = true;
                media.setAttribute('muted', '');
                media.setAttribute('playsinline', '');
                media.loop = true;
                media.preload = 'metadata';
                if (photo.poster) media.poster = photo.poster;
                media.setAttribute('aria-label', label);
                media.addEventListener('loadedmetadata', function() {
                    showMedia(media.videoWidth, media.videoHeight);
                    if (!reduceMotion) clipObserver.observe(media);
                });
            } else {
                media = document.createElement('img');
                media.alt = label;
                media.decoding = 'async';
                media.draggable = false;
                media.addEventListener('load', function() {
                    showMedia(media.naturalWidth, media.naturalHeight);
                });
            }
            media.addEventListener('error', function() {
                console.warn('Could not load photo:', photo.src);
                clipObserver.unobserve(media);
                figure.remove();
            });
            media.src = photo.src;
            frame.appendChild(media);

            if (caption) {
                const figcaption = document.createElement('figcaption');
                figcaption.textContent = caption;
                frame.appendChild(figcaption);
            }
            figure.appendChild(frame);

            // Touch screens have no hover, so a tap toggles the caption
            // (and, with reduced motion on, plays or pauses a clip)
            figure.addEventListener('click', function() {
                figure.classList.toggle('show-caption');
                if (clip && reduceMotion) {
                    if (media.paused) {
                        media.play().catch(function() {});
                    } else {
                        media.pause();
                    }
                }
            });
            return figure;
        }

        // No right-click (or Android long-press) "Save image/video as…" menu
        // and no dragging a photo out. This only stops casual saving: a
        // screenshot or the browser's developer tools still get the file.
        ['contextmenu', 'dragstart'].forEach(function(type) {
            photoGridElement.addEventListener(type, function(event) {
                if (event.target.closest('.photo')) event.preventDefault();
            });
        });

        function showNextBatch() {
            const batch = photos.slice(photosShown, photosShown + PHOTOS_PER_BATCH);
            batch.forEach(function(photo) {
                photoGridElement.appendChild(createPhotoElement(photo));
            });
            photosShown += batch.length;

            if (photosShown >= photos.length) {
                galleryObserver.disconnect();
            } else {
                // Re-observe so a still-visible sentinel triggers the next batch
                galleryObserver.unobserve(sentinelElement);
                galleryObserver.observe(sentinelElement);
            }
        }

        function startGallery() {
            if (galleryStarted) return;
            galleryStarted = true;

            if (photos.length === 0) {
                photoGridElement.insertAdjacentHTML('afterend',
                    '<p class="gallery-empty">Film photos coming soon.</p>');
                return;
            }

            // Load the next batch once the bottom of the grid is near the screen
            galleryObserver = new IntersectionObserver(function(entries) {
                if (entries[0].isIntersecting) showNextBatch();
            }, { rootMargin: '800px 0px' });
            galleryObserver.observe(sentinelElement);
        }

        // ---- Super 8 page (YouTube projects) ----
        const super8Projects = window.SUPER8 || [];
        const super8Element = document.getElementById('super8');
        const videoListElement = document.getElementById('videoList');
        let super8Started = false;

        // Accepts any YouTube link (youtu.be/…, watch?v=…, /shorts/…) or a bare ID
        function youTubeId(link) {
            const text = String(link || '').trim();
            const match = text.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
            if (match) return match[1];
            return /^[\w-]{11}$/.test(text) ? text : null;
        }

        // YouTube's player script, loaded once, only when a video is near
        let youTubeReady = null;
        function loadYouTube() {
            if (!youTubeReady) {
                youTubeReady = new Promise(function(resolve) {
                    window.onYouTubeIframeAPIReady = function() { resolve(window.YT); };
                    const script = document.createElement('script');
                    script.src = 'https://www.youtube.com/iframe_api';
                    document.head.appendChild(script);
                });
            }
            return youTubeReady;
        }

        // Videos autoplay muted (browsers only allow muted autoplay; the
        // player's own button turns the sound on), and only while at least
        // half of one is on screen. With reduced motion on, they wait for a click.
        const videoPlayObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                const frame = entry.target;
                frame.inView = entry.isIntersecting;
                if (!frame.player) return;
                if (entry.isIntersecting) {
                    if (!reduceMotion) frame.player.playVideo();
                } else {
                    frame.player.pauseVideo();
                }
            });
        }, { threshold: 0.5 });

        // Each player is created as its video nears the screen, so the page
        // doesn't load every video at once
        const videoLoadObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (!entry.isIntersecting) return;
                const frame = entry.target;
                videoLoadObserver.unobserve(frame);
                loadYouTube().then(function(YT) {
                    const holder = document.createElement('div');
                    frame.appendChild(holder);
                    new YT.Player(holder, {
                        host: 'https://www.youtube-nocookie.com',
                        videoId: frame.dataset.videoId,
                        width: '100%',
                        height: '100%',
                        playerVars: {
                            mute: 1,
                            playsinline: 1,
                            loop: 1,
                            playlist: frame.dataset.videoId,  // needed for loop
                            rel: 0
                        },
                        events: {
                            onReady: function(event) {
                                frame.player = event.target;
                                if (frame.inView && !reduceMotion) frame.player.playVideo();
                            }
                        }
                    });
                });
            });
        }, { rootMargin: '600px 0px' });

        function createProjectElement(project) {
            const article = document.createElement('article');
            article.className = 'video-project';
            const id = youTubeId(project.youtube);

            if (id) {
                const frame = document.createElement('div');
                frame.className = 'video-frame';
                frame.dataset.videoId = id;
                // e.g. ratio: '4 / 3' for a video without black side bars
                if (project.ratio) frame.style.aspectRatio = project.ratio;
                article.appendChild(frame);
                videoLoadObserver.observe(frame);
                videoPlayObserver.observe(frame);
            } else {
                console.warn('Not a YouTube link:', project.youtube);
            }

            if (project.title) {
                const heading = document.createElement('h2');
                heading.textContent = project.title;
                article.appendChild(heading);
            }

            // Same format as the photo captions, e.g. "Summer 2023 · Ann Arbor, MI"
            const when = captionFor(project);
            if (when) {
                const whenElement = document.createElement('p');
                whenElement.className = 'video-when';
                whenElement.textContent = when;
                article.appendChild(whenElement);
            }

            // A blank line in the blurb starts a new paragraph
            if (project.blurb) {
                const blurb = document.createElement('div');
                blurb.className = 'video-blurb';
                project.blurb.split(/\n\s*\n/).forEach(function(text) {
                    const paragraph = document.createElement('p');
                    paragraph.textContent = text.trim();
                    blurb.appendChild(paragraph);
                });
                article.appendChild(blurb);
            }
            // No separate YouTube link: the player's own title and logo open
            // the video on YouTube
            return article;
        }

        function startSuper8() {
            if (super8Started) return;
            super8Started = true;
            if (super8Projects.length === 0) {
                videoListElement.innerHTML = '<p class="gallery-empty">Super 8 films coming soon.</p>';
                return;
            }
            super8Projects.forEach(function(project) {
                videoListElement.appendChild(createProjectElement(project));
            });
        }

        function showCurrentPage() {
            // Film is the home page for now, so any address other than
            // #super8 shows it (including #photography, its first address)
            const onSuper8 = window.location.hash === '#super8';
            filmElement.hidden = onSuper8;
            super8Element.hidden = !onSuper8;
            if (onSuper8) {
                startSuper8();
            } else {
                startGallery();
            }
        }

        window.addEventListener('hashchange', showCurrentPage);
        showCurrentPage();

        // ---- Logos ----
        // Each logo swaps between its two drawings on its own random timer.
        // The title (data-swap="click") only swaps after its dot is clicked.
        // Visitors who ask their device to reduce motion see them hold still.
        const LOGO_SWAP_MIN_MS = 300;
        const LOGO_SWAP_MAX_MS = 1500;
        const logoTimers = new Map();

        function startSwapping(logo) {
            function swapLater() {
                const delay = LOGO_SWAP_MIN_MS + Math.random() * (LOGO_SWAP_MAX_MS - LOGO_SWAP_MIN_MS);
                logoTimers.set(logo, setTimeout(function() {
                    logo.classList.toggle('show-alt');
                    swapLater();
                }, delay));
            }
            swapLater();
        }

        function stopSwapping(logo) {
            clearTimeout(logoTimers.get(logo));
            logoTimers.delete(logo);
        }

        if (!reduceMotion) {
            document.querySelectorAll('.logo:not([data-swap="click"])').forEach(startSwapping);
        }

        // Clicking the title's dot starts its swapping; clicking again stops it
        const siteTitleElement = document.querySelector('.site-title');
        siteTitleElement.addEventListener('click', function(event) {
            if (!event.target.classList.contains('title-dot')) return;
            if (reduceMotion) {
                siteTitleElement.classList.toggle('show-alt');  // one change per click
            } else if (logoTimers.has(siteTitleElement)) {
                stopSwapping(siteTitleElement);
            } else {
                startSwapping(siteTitleElement);
            }
        });
    </script>
</body>
</html>
