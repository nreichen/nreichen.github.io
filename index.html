<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nathan·reichen</title>
    <!-- Tab icon: Nathan's drawn "n" (16, 32 and 48px in one file; its cream
         fill and dark outline read on light and dark tabs), and
         apple-touch-icon for iPhone home screens. Both are made from
         images/logos/tab/n.png by tools/tab_icon.py -->
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script>
        // Apply a light/dark choice saved by the moon button before the page
        // draws, so it doesn't flash the other version first
        try {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                document.documentElement.dataset.theme = savedTheme;
            }
        } catch (e) {}
    </script>
    <style>
        /* The site's one font, for every caption, link and paragraph (the
           title and icons are drawings). Bundled with the site so every
           visitor sees the same one: Instrument Sans, regular weight, Latin
           letters (SIL Open Font License: fonts/instrument-sans-OFL.txt) */
        @font-face {
            font-family: 'Instrument Sans';
            src: url('fonts/instrument-sans-latin-400-normal.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }

        /* Semibold, only for the sidebar links (cream letters with a dark
           outline need thicker strokes so the cream shows) */
        @font-face {
            font-family: 'Instrument Sans';
            src: url('fonts/instrument-sans-latin-600-normal.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }

        /* Light and dark versions of the site. The visitor's device setting
           picks one until they choose with the moon button, which sets
           data-theme on <html>. Each has its own background picture and
           text color. */
        :root {
            /* The two colors of Nathan's drawings: the dark gray outline and
               the cream fill. Text is the dark gray by day and the cream at
               night, so it matches the title, menu and moon. */
            --logo-ink: #333;
            --logo-cream: #F8F1EA;
            --background-image: url('images/background-light.jpg');
            --background-color: white;
            --text-color: var(--logo-ink);
            --icon-shadow: rgba(255, 255, 255, 0.6);
        }

        /* Dark when the device is in dark mode, unless the visitor chose light */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --background-image: url('images/background-dark.jpg');
                --background-color: #222;
                --text-color: var(--logo-cream);
                --icon-shadow: rgba(0, 0, 0, 0.5);
            }
        }

        /* Dark when the visitor chose it with the moon button */
        :root[data-theme="dark"] {
            --background-image: url('images/background-dark.jpg');
            --background-color: #222;
            --text-color: var(--logo-cream);
            --icon-shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Site-wide background picture (light or dark, set above), fixed in
           place on every page and screen size. A fixed layer is used instead
           of background-attachment: fixed, which iPhones ignore. */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            /* 35% across keeps the mountain's main peak in view on narrow
               screens; wide screens show the picture's full width anyway */
            background: var(--background-image) 35% center / cover no-repeat;
        }

        /* Menu and night mode buttons: same size, color and shadow */
        .icon-button {
            position: fixed;
            top: 20px;
            width: 40px;
            height: 40px;
            box-sizing: border-box;
            padding: 6px;
            border: 0;
            background: none;
            color: var(--text-color);
            cursor: pointer;
            z-index: 1000;
            /* Keeps the icons visible when they pass over a photo */
            filter: drop-shadow(0 1px 2px var(--icon-shadow));
        }

        .icon-button img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .menu-icon {
            left: 20px;
            transition: transform 0.3s ease;
        }

        .menu-icon.open {
            transform: rotate(90deg);
        }

        .theme-toggle {
            right: 20px;
        }

        /* Logos (title, menu, moon) each have their drawings ("frames")
           stacked in the same spot; only the one marked .current shows, and
           the script moves .current to animate them */
        .logo {
            display: grid;
            place-items: center;
        }

        .icon-button.logo {
            grid-template: 100% / 100%;
        }

        .logo-frame {
            grid-area: 1 / 1;
        }

        .logo-frame:not(.current) {
            visibility: hidden;
        }

        .header-container {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
        }

        /* Site title: Nathan's hand-drawn "nathan·reichen", three frames */
        .site-title {
            margin: 0;
            filter: drop-shadow(0 1px 2px var(--icon-shadow));
        }

        .site-title img {
            display: block;
            height: 40px; /* Same height as the icons */
            width: auto;
            /* Never wider than the gap between the menu and moon buttons
               (each 20px from the edge, 40px wide, plus 10px breathing room);
               on narrow phones the drawing shrinks to fit */
            max-width: calc(100vw - 140px);
            object-fit: contain;
        }

        /* No long-press "Save image" menu or text selection on the logos */
        .logo img {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Sidebar menu: no panel, just links over the background. While
           closed it is also hidden, so Tab and screen readers skip its links;
           the hide waits until the 0.3s slide-out has finished. */
        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            visibility: hidden;
            transition: left 0.3s ease, visibility 0s linear 0.3s;
            z-index: 900;
        }

        .sidebar.open {
            left: 0;
            visibility: visible;
            transition-delay: 0s;  /* show at once when opening */
        }

        .sidebar-content {
            padding: 80px 20px 20px;
        }

        /* Links drawn like the title in both modes: cream letters with a
           dark outline. The stroke is painted behind the letters
           (paint-order), so only its outer half shows, as an outline. */
        .sidebar-link {
            display: block;
            margin-bottom: 15px;
            color: var(--logo-cream);
            -webkit-text-stroke: 3px var(--logo-ink);
            paint-order: stroke fill;
            text-decoration: none;
            font-size: 20px;
            font-weight: 600;
            /* Same faint shadow as the title and icons */
            filter: drop-shadow(0 1px 2px var(--icon-shadow));
            transition: opacity 0.2s;
        }

        .sidebar-link:hover {
            opacity: 0.6;
        }

        /* Opening the menu at the top of the page slides the photos (or
           Super 8 videos) down below its links, so the links sit on the
           mountains rather than on a photo. The script sets --menu-space to
           just below the last link when the menu opens. */
        :root {
            --menu-space: 160px;
        }

        .gallery-page,
        .video-page {
            transition: padding-top 0.3s ease;
        }

        body.menu-push .gallery-page,
        body.menu-push .video-page {
            padding-top: max(100px, var(--menu-space));
        }

        /* Film page (photo gallery) */
        .gallery-page {
            /* Same space between photos as between photos and the screen edges */
            --photo-spacing: 20px;
            width: 100%;
            box-sizing: border-box;
            padding: 100px var(--photo-spacing) var(--photo-spacing);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--photo-spacing);
        }

        /* Square cells so vertical and horizontal photos show at the same
           size: each photo's long edge fills the cell, uncropped and centered */
        .photo {
            margin: 0;
            aspect-ratio: 1 / 1;
            display: grid;
            place-items: center;
            background-color: #f2f2f2;
        }

        .photo.loaded {
            background-color: transparent;
        }

        /* Wraps the image tightly so the caption sits on the photo itself */
        .photo-frame {
            position: relative;
            overflow: hidden;
        }

        .photo img,
        .photo video {
            display: block;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.4s ease;
            /* No dragging photos out, and no iPhone long-press "Save to
               Photos" menu (see the contextmenu handler in the script) */
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .photo.loaded img,
        .photo.loaded video {
            opacity: 1;
        }

        .photo figcaption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 24px 12px 10px;
            /* Captions sit on a dark band in both modes, so always cream */
            color: var(--logo-cream);
            font-size: 14px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        /* Hover is on the photo itself (.photo-frame), not its square cell,
           so the blank space beside a photo doesn't bring up the caption */
        .photo-frame:hover figcaption,
        .photo:focus-visible figcaption,
        .photo.show-caption figcaption {
            opacity: 1;
        }

        .gallery-empty {
            color: var(--text-color);
            text-align: center;
        }

        /* Super 8 page: one YouTube project per row, centered, each with a
           title, a paragraph and a link to watch it on YouTube */
        .video-page {
            width: 100%;
            max-width: 960px;
            box-sizing: border-box;
            padding: 100px 20px 40px;
        }

        .video-project {
            margin: 0 0 96px;
            text-align: center;
            color: var(--text-color);
            /* Keeps the text readable over the background picture */
            text-shadow: 0 1px 2px var(--icon-shadow);
        }

        .video-frame {
            position: relative;
            aspect-ratio: 16 / 9;
            background-color: #000;
        }

        .video-frame iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .video-project h2 {
            margin: 28px 0 4px;
            font-size: 22px;
            font-weight: normal;
        }

        .video-when {
            margin: 0;
            font-size: 14px;
            opacity: 0.75;
        }

        .video-blurb p {
            max-width: 640px;
            margin: 16px auto 0;
            font-size: 16px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <!-- The title, menu, and moon are "logos": each holds its drawings
         (class="logo-frame") in order, and the script plays them back and
         forth (1 2 3 2 1 …) so the hand-drawn ones look alive. The first
         frame is marked "current" so it shows before the script runs. All
         three are Nathan's drawings (small copies in images/logos/*/site/). -->

    <!-- Night mode toggle in the top right -->
    <button id="themeToggle" class="icon-button theme-toggle logo" type="button" aria-label="Night mode" aria-pressed="false">
        <img class="logo-frame current" src="images/logos/moon/site/1.png" alt="" draggable="false">
        <img class="logo-frame" src="images/logos/moon/site/2.png" alt="" draggable="false">
        <img class="logo-frame" src="images/logos/moon/site/3.png" alt="" draggable="false">
    </button>

    <!-- Menu button in the top left -->
    <button id="menuIcon" class="icon-button menu-icon logo" type="button" aria-label="Menu" aria-expanded="false">
        <img class="logo-frame current" src="images/logos/menu/site/1.png" alt="" draggable="false">
        <img class="logo-frame" src="images/logos/menu/site/2.png" alt="" draggable="false">
        <img class="logo-frame" src="images/logos/menu/site/3.png" alt="" draggable="false">
    </button>

    <!-- Site title -->
    <div class="header-container">
        <h1 class="site-title">
            <!-- Clicking the title goes to the home page -->
            <a href="./" class="title-link logo">
                <img class="logo-frame current" src="images/logos/title/site/1.png" alt="nathan·reichen" draggable="false">
                <img class="logo-frame" src="images/logos/title/site/2.png" alt="nathan·reichen" draggable="false">
                <img class="logo-frame" src="images/logos/title/site/3.png" alt="nathan·reichen" draggable="false">
            </a>
        </h1>
    </div>

    <!-- Sidebar menu -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-content">
            <a href="#film" class="sidebar-link">Film</a>
            <a href="#super8" class="sidebar-link">Super 8</a>
        </div>
    </nav>

    <!-- Film photos page: the home page for now, and #film -->
    <main id="film" class="gallery-page" hidden>
        <div id="photoGrid" class="photo-grid"></div>
        <div id="gallerySentinel"></div>
    </main>

    <!-- Super 8 page (YouTube projects), shown when the URL ends in #super8 -->
    <main id="super8" class="video-page" hidden>
        <div id="videoList"></div>
    </main>

    <!-- List of film photos; edit photos.js to add more -->
    <script src="photos.js"></script>
    <!-- List of Super 8 projects; edit super8.js to add more -->
    <script src="super8.js"></script>
    <script>
        let isSidebarOpen = false;
        const menuIconElement = document.getElementById('menuIcon');
        const sidebarElement = document.getElementById('sidebar');

        // Function to toggle sidebar
        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            menuIconElement.setAttribute('aria-expanded', isSidebarOpen);
            if (isSidebarOpen) {
                // Room for the links (see "menu-push" in the styles): from
                // the top of the screen to just below the last one
                const links = sidebarElement.querySelectorAll('.sidebar-link');
                const lastLinkBottom = links[links.length - 1].getBoundingClientRect().bottom;
                document.documentElement.style.setProperty('--menu-space', Math.ceil(lastLinkBottom + 24) + 'px');
                // Only near the top of the page: further down, sliding the
                // page would just make the photos on screen jump
                document.body.classList.toggle('menu-push', window.scrollY < 100);
                sidebarElement.classList.add('open');
                menuIconElement.classList.add('open');
            } else {
                document.body.classList.remove('menu-push');
                sidebarElement.classList.remove('open');
                menuIconElement.classList.remove('open');
            }
        }

        // Add click event listener to menu icon
        menuIconElement.addEventListener('click', toggleSidebar);

        // Close the sidebar after picking a page
        document.querySelectorAll('.sidebar-link').forEach(function(link) {
            link.addEventListener('click', function() {
                if (isSidebarOpen) toggleSidebar();
            });
        });

        // ---- Night mode toggle ----
        const themeToggleElement = document.getElementById('themeToggle');
        const deviceDarkQuery = window.matchMedia('(prefers-color-scheme: dark)');

        // The visitor's choice wins; otherwise follow the device setting
        function isDarkMode() {
            const chosenTheme = document.documentElement.dataset.theme;
            return chosenTheme ? chosenTheme === 'dark' : deviceDarkQuery.matches;
        }

        function updateThemeToggle() {
            themeToggleElement.setAttribute('aria-pressed', isDarkMode());
        }

        themeToggleElement.addEventListener('click', function() {
            const newTheme = isDarkMode() ? 'light' : 'dark';
            document.documentElement.dataset.theme = newTheme;
            try {
                localStorage.setItem('theme', newTheme);
            } catch (e) {}
            updateThemeToggle();
        });

        deviceDarkQuery.addEventListener('change', updateThemeToggle);
        updateThemeToggle();

        // Visitors who ask their device to reduce motion get still logos and
        // clips that only play when tapped
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ---- Film page (photo gallery) ----
        const photos = window.PHOTOS || [];
        const PHOTOS_PER_BATCH = 8;
        const filmElement = document.getElementById('film');
        const photoGridElement = document.getElementById('photoGrid');
        const sentinelElement = document.getElementById('gallerySentinel');
        let photosShown = 0;
        let galleryStarted = false;
        let galleryObserver = null;

        // e.g. "Fall 2024 · Ann Arbor, MI · Pentax K1000"; parts that aren't
        // known are left out ("Fall 2024", "Fall 2024 · Ann Arbor, MI")
        function captionFor(photo) {
            const when = [photo.season, photo.year].filter(Boolean).join(' ');
            return [when, photo.location, photo.camera].filter(Boolean).join(' · ');
        }

        // Clips (the RETO 3D loops) play like GIFs, but only while on screen
        const clipObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.play().catch(function() {});
                } else {
                    entry.target.pause();
                }
            });
        }, { threshold: 0.25 });

        function isClip(photo) {
            return /\.(mp4|webm|mov)$/i.test(photo.src);
        }

        function createPhotoElement(photo) {
            const caption = captionFor(photo);
            const label = caption ? 'Film photograph, ' + caption : 'Film photograph';
            const clip = isClip(photo);
            const figure = document.createElement('figure');
            figure.className = 'photo';
            figure.tabIndex = 0;
            const frame = document.createElement('div');
            frame.className = 'photo-frame';

            // Size the frame to the media's proportions, long edge filling the cell
            function showMedia(width, height) {
                frame.style.aspectRatio = width + ' / ' + height;
                if (width >= height) {
                    frame.style.width = '100%';
                } else {
                    frame.style.height = '100%';
                }
                figure.classList.add('loaded');
            }

            let media;
            if (clip) {
                media = document.createElement('video');
                // iPhones only play inline, without a tap, when these are attributes
                media.muted = true;
                media.setAttribute('muted', '');
                media.setAttribute('playsinline', '');
                media.loop = true;
                media.preload = 'metadata';
                if (photo.poster) media.poster = photo.poster;
                media.setAttribute('aria-label', label);
                media.addEventListener('loadedmetadata', function() {
                    showMedia(media.videoWidth, media.videoHeight);
                    if (!reduceMotion) clipObserver.observe(media);
                });
            } else {
                media = document.createElement('img');
                media.alt = label;
                media.decoding = 'async';
                media.draggable = false;
                media.addEventListener('load', function() {
                    showMedia(media.naturalWidth, media.naturalHeight);
                });
            }
            media.addEventListener('error', function() {
                console.warn('Could not load photo:', photo.src);
                clipObserver.unobserve(media);
                figure.remove();
            });
            media.src = photo.src;
            frame.appendChild(media);

            if (caption) {
                const figcaption = document.createElement('figcaption');
                figcaption.textContent = caption;
                frame.appendChild(figcaption);
            }
            figure.appendChild(frame);

            // Touch screens have no hover, so a tap on the photo (not the
            // blank space around it) toggles the caption (and, with reduced
            // motion on, plays or pauses a clip)
            frame.addEventListener('click', function() {
                figure.classList.toggle('show-caption');
                if (clip && reduceMotion) {
                    if (media.paused) {
                        media.play().catch(function() {});
                    } else {
                        media.pause();
                    }
                }
            });
            return figure;
        }

        // No right-click (or Android long-press) "Save image/video as…" menu
        // and no dragging a photo out. This only stops casual saving: a
        // screenshot or the browser's developer tools still get the file.
        ['contextmenu', 'dragstart'].forEach(function(type) {
            photoGridElement.addEventListener(type, function(event) {
                if (event.target.closest('.photo')) event.preventDefault();
            });
        });

        function showNextBatch() {
            const batch = photos.slice(photosShown, photosShown + PHOTOS_PER_BATCH);
            batch.forEach(function(photo) {
                photoGridElement.appendChild(createPhotoElement(photo));
            });
            photosShown += batch.length;

            if (photosShown >= photos.length) {
                galleryObserver.disconnect();
            } else {
                // Re-observe so a still-visible sentinel triggers the next batch
                galleryObserver.unobserve(sentinelElement);
                galleryObserver.observe(sentinelElement);
            }
        }

        function startGallery() {
            if (galleryStarted) return;
            galleryStarted = true;

            if (photos.length === 0) {
                photoGridElement.insertAdjacentHTML('afterend',
                    '<p class="gallery-empty">Film photos coming soon.</p>');
                return;
            }

            // Load the next batch once the bottom of the grid is near the screen
            galleryObserver = new IntersectionObserver(function(entries) {
                if (entries[0].isIntersecting) showNextBatch();
            }, { rootMargin: '800px 0px' });
            galleryObserver.observe(sentinelElement);
        }

        // ---- Super 8 page (YouTube projects) ----
        const super8Projects = window.SUPER8 || [];
        const super8Element = document.getElementById('super8');
        const videoListElement = document.getElementById('videoList');
        let super8Started = false;

        // Accepts any YouTube link (youtu.be/…, watch?v=…, /shorts/…) or a bare ID
        function youTubeId(link) {
            const text = String(link || '').trim();
            const match = text.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([\w-]{11})/);
            if (match) return match[1];
            return /^[\w-]{11}$/.test(text) ? text : null;
        }

        // YouTube's player script, loaded once, only when a video is near
        let youTubeReady = null;
        function loadYouTube() {
            if (!youTubeReady) {
                youTubeReady = new Promise(function(resolve) {
                    window.onYouTubeIframeAPIReady = function() { resolve(window.YT); };
                    const script = document.createElement('script');
                    script.src = 'https://www.youtube.com/iframe_api';
                    document.head.appendChild(script);
                });
            }
            return youTubeReady;
        }

        // Videos autoplay muted (browsers only allow muted autoplay; the
        // player's own button turns the sound on), and only while at least
        // half of one is on screen. With reduced motion on, they wait for a click.
        const videoPlayObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                const frame = entry.target;
                frame.inView = entry.isIntersecting;
                if (!frame.player) return;
                if (entry.isIntersecting) {
                    if (!reduceMotion) frame.player.playVideo();
                } else {
                    frame.player.pauseVideo();
                }
            });
        }, { threshold: 0.5 });

        // Each player is created as its video nears the screen, so the page
        // doesn't load every video at once
        const videoLoadObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (!entry.isIntersecting) return;
                const frame = entry.target;
                videoLoadObserver.unobserve(frame);
                loadYouTube().then(function(YT) {
                    const holder = document.createElement('div');
                    frame.appendChild(holder);
                    new YT.Player(holder, {
                        host: 'https://www.youtube-nocookie.com',
                        videoId: frame.dataset.videoId,
                        width: '100%',
                        height: '100%',
                        playerVars: {
                            mute: 1,
                            playsinline: 1,
                            loop: 1,
                            playlist: frame.dataset.videoId,  // needed for loop
                            rel: 0
                        },
                        events: {
                            onReady: function(event) {
                                frame.player = event.target;
                                if (frame.inView && !reduceMotion) frame.player.playVideo();
                            }
                        }
                    });
                });
            });
        }, { rootMargin: '600px 0px' });

        function createProjectElement(project) {
            const article = document.createElement('article');
            article.className = 'video-project';
            const id = youTubeId(project.youtube);

            if (id) {
                const frame = document.createElement('div');
                frame.className = 'video-frame';
                frame.dataset.videoId = id;
                // e.g. ratio: '4 / 3' for a video without black side bars
                if (project.ratio) frame.style.aspectRatio = project.ratio;
                article.appendChild(frame);
                videoLoadObserver.observe(frame);
                videoPlayObserver.observe(frame);
            } else {
                console.warn('Not a YouTube link:', project.youtube);
            }

            if (project.title) {
                const heading = document.createElement('h2');
                heading.textContent = project.title;
                article.appendChild(heading);
            }

            // Same format as the photo captions, e.g. "Summer 2023 · Ann Arbor, MI"
            const when = captionFor(project);
            if (when) {
                const whenElement = document.createElement('p');
                whenElement.className = 'video-when';
                whenElement.textContent = when;
                article.appendChild(whenElement);
            }

            // A blank line in the blurb starts a new paragraph
            if (project.blurb) {
                const blurb = document.createElement('div');
                blurb.className = 'video-blurb';
                project.blurb.split(/\n\s*\n/).forEach(function(text) {
                    const paragraph = document.createElement('p');
                    paragraph.textContent = text.trim();
                    blurb.appendChild(paragraph);
                });
                article.appendChild(blurb);
            }
            // No separate YouTube link: the player's own title and logo open
            // the video on YouTube
            return article;
        }

        function startSuper8() {
            if (super8Started) return;
            super8Started = true;
            if (super8Projects.length === 0) {
                videoListElement.innerHTML = '<p class="gallery-empty">Super 8 films coming soon.</p>';
                return;
            }
            super8Projects.forEach(function(project) {
                videoListElement.appendChild(createProjectElement(project));
            });
        }

        function showCurrentPage() {
            // Film is the home page for now, so any address other than
            // #super8 shows it (including #photography, its first address)
            const onSuper8 = window.location.hash === '#super8';
            filmElement.hidden = onSuper8;
            super8Element.hidden = !onSuper8;
            if (onSuper8) {
                startSuper8();
            } else {
                startGallery();
            }
        }

        window.addEventListener('hashchange', showCurrentPage);
        showCurrentPage();

        // Clicking the title goes to the home page (Film, for now) and back
        // to the top, without reloading. The link's plain address ("./")
        // still works on its own, e.g. Cmd/Ctrl-click for a new tab.
        document.querySelector('.title-link').addEventListener('click', function(event) {
            if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            event.preventDefault();
            if (window.location.hash) {
                // Drop the #super8 etc. from the address; Back returns to it
                history.pushState(null, '', window.location.pathname + window.location.search);
                showCurrentPage();
            }
            if (isSidebarOpen) toggleSidebar();
            window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
        });

        // ---- Logos ----
        // Each logo plays its frames back and forth, one step every
        // LOGO_FRAME_MS: 1 2 3 2 1 2 3 … (two frames just alternate). The
        // logos are offset from each other by a fraction of a step so they
        // don't all change at the same instant. Visitors who ask their
        // device to reduce motion see frame 1 held.
        const LOGO_FRAME_MS = 500;

        // Move one step along the back-and-forth sequence
        function stepLogo(logo) {
            const frames = logo.querySelectorAll(':scope > .logo-frame');
            if (frames.length < 2) return;
            let index = Array.prototype.findIndex.call(frames, function(frame) {
                return frame.classList.contains('current');
            });
            let direction = Number(logo.dataset.direction) || 1;
            if (index + direction < 0 || index + direction >= frames.length) {
                direction = -direction;  // turn around at either end
            }
            frames[Math.max(index, 0)].classList.remove('current');
            index = Math.max(index, 0) + direction;
            frames[index].classList.add('current');
            logo.dataset.direction = direction;
        }

        function startAnimating(logo, delay) {
            setTimeout(function() {
                stepLogo(logo);
                setInterval(stepLogo, LOGO_FRAME_MS, logo);
            }, LOGO_FRAME_MS + delay);
        }

        if (!reduceMotion) {
            const logos = document.querySelectorAll('.logo');
            logos.forEach(function(logo, i) {
                startAnimating(logo, LOGO_FRAME_MS * i / logos.length);
            });
        }
    </script>
</body>
</html>
