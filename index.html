<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Website</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            overflow-x: hidden;
        }

        .menu-icon {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.3s ease;
        }
        
        .menu-icon.open {
            transform: rotate(90deg);
        }

        .header-container {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
        }

        .header-image {
            height: 40px; /* Same height as the menu icon */
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background-color: white;
            transition: left 0.3s ease;
            z-index: 900;
            border-right: 0px solid black;
        }

        .sidebar.open {
            left: 0;
            border-right: 1px solid black;
        }

        .sidebar-content {
            padding: 80px 20px 20px;
        }

        .sidebar-link {
            display: block;
            margin-bottom: 15px;
            color: #333;
            text-decoration: none;
            font-size: 18px;
            transition: color 0.2s;
        }

        .sidebar-link:hover {
            color: #666;
        }

        /* Photography page */
        .gallery-page {
            width: 100%;
            max-width: 1100px;
            box-sizing: border-box;
            padding: 100px 20px 40px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            align-items: start;
        }

        .photo {
            position: relative;
            margin: 0;
            /* Placeholder shape until the image loads, then its real proportions */
            aspect-ratio: 3 / 2;
            background-color: #f2f2f2;
            overflow: hidden;
        }

        .photo.loaded {
            aspect-ratio: auto;
            background-color: transparent;
        }

        .photo img {
            display: block;
            width: 100%;
            height: auto;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .photo.loaded img {
            opacity: 1;
        }

        .photo figcaption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 24px 12px 10px;
            color: white;
            font-size: 14px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .photo:hover figcaption,
        .photo:focus-visible figcaption,
        .photo.show-caption figcaption {
            opacity: 1;
        }

        .gallery-empty {
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Menu icon in the top left -->
    <img id="menuIcon" class="menu-icon" src="/api/placeholder/40/40" alt="Menu">

    <!-- Header with name in handwriting -->
    <div class="header-container">
        <img id="headerName" class="header-image" src="./images/header-name1.jpg" alt="Handwritten Name">
    </div>
    
    <!-- Sidebar Menu -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-content">
            <a href="#" class="sidebar-link">Home</a>
            <a href="#photography" class="sidebar-link">Photography</a>
            <a href="#" class="sidebar-link">Film</a>
            <a href="#" class="sidebar-link">About</a>
            <a href="#" class="sidebar-link">Contact</a>
        </div>
    </div>

    <!-- Photography page, shown when the URL ends in #photography -->
    <main id="photography" class="gallery-page" hidden>
        <div id="photoGrid" class="photo-grid"></div>
        <div id="gallerySentinel"></div>
    </main>

    <!-- List of film photos; edit photos.js to add more -->
    <script src="photos.js"></script>
    <script>
        // Array of image sources for your handwritten name
        // Replace these with your actual uploaded image paths
        const nameImages = [
            './images/header-name1.jpg', // First variation of handwritten name
            './images/header-name2.jpg'  // Second variation of handwritten name
            // Add more variations as needed
        ];

        // Array of image sources for your menu icon
        // Replace these with your actual uploaded image paths
        const menuImages = [
            'images/menu/menu-icon1.jpg', // First variation of menu icon
            'images/menu/menu-icon2.jpg'  // Second variation of menu icon
            // Add more variations as needed
        ];

        let nameIndex = 0;
        let menuIndex = 0;
        let isSidebarOpen = false;
        const headerNameElement = document.getElementById('headerName');
        const menuIconElement = document.getElementById('menuIcon');
        const sidebarElement = document.getElementById('sidebar');

        // Preload all images to prevent flickering
        function preloadImages(imageArray) {
            const preloadedImages = [];
            for (let i = 0; i < imageArray.length; i++) {
                const img = new Image();
                img.src = imageArray[i];
                preloadedImages.push(img);
            }
            return preloadedImages;
        }

        // Preload all images when the page loads
        const preloadedNameImages = preloadImages(nameImages);
        const preloadedMenuImages = preloadImages(menuImages);

        // Function to cycle through handwritten name images
        function cycleNameImage() {
            nameIndex = (nameIndex + 1) % nameImages.length;
            headerNameElement.src = nameImages[nameIndex];
        }

        // Function to cycle through menu icon images
        function cycleMenuImage() {
            menuIndex = (menuIndex + 1) % menuImages.length;
            menuIconElement.src = menuImages[menuIndex];
        }

        // Function to toggle sidebar
        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            if (isSidebarOpen) {
                sidebarElement.classList.add('open');
                menuIconElement.classList.add('open');
            } else {
                sidebarElement.classList.remove('open');
                menuIconElement.classList.remove('open');
            }
        }

        // Add click event listener to menu icon
        menuIconElement.addEventListener('click', toggleSidebar);

        // Close the sidebar after picking a page
        document.querySelectorAll('.sidebar-link').forEach(function(link) {
            link.addEventListener('click', function() {
                if (isSidebarOpen) toggleSidebar();
            });
        });

        // ---- Photography page ----
        const photos = window.PHOTOS || [];
        const PHOTOS_PER_BATCH = 8;
        const photographyElement = document.getElementById('photography');
        const photoGridElement = document.getElementById('photoGrid');
        const sentinelElement = document.getElementById('gallerySentinel');
        let photosShown = 0;
        let galleryStarted = false;
        let galleryObserver = null;

        // e.g. "Fall 2024 · Ann Arbor, MI", or "Fall 2024" with no location
        function captionFor(photo) {
            const when = [photo.season, photo.year].filter(Boolean).join(' ');
            return [when, photo.location].filter(Boolean).join(' · ');
        }

        function createPhotoElement(photo) {
            const caption = captionFor(photo);
            const figure = document.createElement('figure');
            figure.className = 'photo';
            figure.tabIndex = 0;

            const img = document.createElement('img');
            img.alt = caption ? 'Film photograph, ' + caption : 'Film photograph';
            img.decoding = 'async';
            img.addEventListener('load', function() {
                figure.classList.add('loaded');
            });
            img.addEventListener('error', function() {
                console.warn('Could not load photo:', photo.src);
                figure.remove();
            });
            img.src = photo.src;
            figure.appendChild(img);

            if (caption) {
                const figcaption = document.createElement('figcaption');
                figcaption.textContent = caption;
                figure.appendChild(figcaption);
            }

            // Touch screens have no hover, so a tap toggles the caption
            figure.addEventListener('click', function() {
                figure.classList.toggle('show-caption');
            });
            return figure;
        }

        function showNextBatch() {
            const batch = photos.slice(photosShown, photosShown + PHOTOS_PER_BATCH);
            batch.forEach(function(photo) {
                photoGridElement.appendChild(createPhotoElement(photo));
            });
            photosShown += batch.length;

            if (photosShown >= photos.length) {
                galleryObserver.disconnect();
            } else {
                // Re-observe so a still-visible sentinel triggers the next batch
                galleryObserver.unobserve(sentinelElement);
                galleryObserver.observe(sentinelElement);
            }
        }

        function startGallery() {
            if (galleryStarted) return;
            galleryStarted = true;

            if (photos.length === 0) {
                photoGridElement.insertAdjacentHTML('afterend',
                    '<p class="gallery-empty">Film photos coming soon.</p>');
                return;
            }

            // Load the next batch once the bottom of the grid is near the screen
            galleryObserver = new IntersectionObserver(function(entries) {
                if (entries[0].isIntersecting) showNextBatch();
            }, { rootMargin: '800px 0px' });
            galleryObserver.observe(sentinelElement);
        }

        function showCurrentPage() {
            const onPhotography = window.location.hash === '#photography';
            photographyElement.hidden = !onPhotography;
            if (onPhotography) startGallery();
        }

        window.addEventListener('hashchange', showCurrentPage);
        showCurrentPage();

        // Wait until images are loaded before starting the animation
        window.addEventListener('load', function() {
            // Set interval to change images with your timing
            setInterval(cycleNameImage, 1500);
            setInterval(cycleMenuImage, 1505);
        });
    </script>
</body>
</html>
