<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Website</title>
    <script>
        // Apply a light/dark choice saved by the moon button before the page
        // draws, so it doesn't flash the other version first
        try {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light' || savedTheme === 'dark') {
                document.documentElement.dataset.theme = savedTheme;
            }
        } catch (e) {}
    </script>
    <style>
        /* Light and dark versions of the site. The visitor's device setting
           picks one until they choose with the moon button, which sets
           data-theme on <html>. Each has its own background picture and
           text color. */
        :root {
            --background-image: url('images/background-light.jpg');
            --background-color: white;
            --text-color: #111;
            --icon-shadow: rgba(255, 255, 255, 0.6);
        }

        /* Dark when the device is in dark mode, unless the visitor chose light */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --background-image: url('images/background-dark.jpg');
                --background-color: #222;
                --text-color: white;
                --icon-shadow: rgba(0, 0, 0, 0.5);
            }
        }

        /* Dark when the visitor chose it with the moon button */
        :root[data-theme="dark"] {
            --background-image: url('images/background-dark.jpg');
            --background-color: #222;
            --text-color: white;
            --icon-shadow: rgba(0, 0, 0, 0.5);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: sans-serif;
            overflow-x: hidden;
        }

        /* Site-wide background picture (light or dark, set above), fixed in
           place on every page and screen size. A fixed layer is used instead
           of background-attachment: fixed, which iPhones ignore. */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            /* 35% across keeps the mountain's main peak in view on narrow
               screens; wide screens show the picture's full width anyway */
            background: var(--background-image) 35% center / cover no-repeat;
        }

        /* Menu and night mode buttons: same size, color and shadow */
        .icon-button {
            position: fixed;
            top: 20px;
            width: 40px;
            height: 40px;
            box-sizing: border-box;
            padding: 6px;
            border: 0;
            background: none;
            color: var(--text-color);
            cursor: pointer;
            z-index: 1000;
            /* Keeps the icons visible when they pass over a photo */
            filter: drop-shadow(0 1px 2px var(--icon-shadow));
        }

        .icon-button svg {
            display: block;
            width: 100%;
            height: 100%;
            fill: currentColor;
        }

        .menu-icon {
            left: 20px;
            transition: transform 0.3s ease;
        }

        .menu-icon.open {
            transform: rotate(90deg);
        }

        .theme-toggle {
            right: 20px;
        }

        /* Logos (title, menu, moon) each have two drawings stacked in the same
           spot; the script swaps which one shows at random intervals */
        .logo {
            display: grid;
            place-items: center;
        }

        .icon-button.logo {
            grid-template: 100% / 100%;
        }

        .logo-frame {
            grid-area: 1 / 1;
        }

        .logo:not(.show-alt) > .logo-frame:nth-child(2),
        .logo.show-alt > .logo-frame:nth-child(1) {
            visibility: hidden;
        }

        .header-container {
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
        }

        /* Site title (placeholder: the same name in two fonts) */
        .site-title {
            margin: 0;
            height: 40px; /* Same height as the icons */
            font-size: 26px;
            font-weight: normal;
            line-height: 40px;
            white-space: nowrap;
            color: var(--text-color);
            text-shadow: 0 1px 2px var(--icon-shadow);
        }

        .title-font-a {
            font-family: Georgia, 'Times New Roman', serif;
        }

        .title-font-b {
            font-family: 'Courier New', Courier, monospace;
        }

        /* Sidebar menu: no panel, just links over the background */
        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            transition: left 0.3s ease;
            z-index: 900;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-content {
            padding: 80px 20px 20px;
        }

        .sidebar-link {
            display: block;
            margin-bottom: 15px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 18px;
            /* Keeps the links readable over photos */
            text-shadow: 0 1px 2px var(--icon-shadow);
            transition: opacity 0.2s;
        }

        .sidebar-link:hover {
            opacity: 0.6;
        }

        /* Film page (photo gallery) */
        .gallery-page {
            /* Same space between photos as between photos and the screen edges */
            --photo-spacing: 20px;
            width: 100%;
            box-sizing: border-box;
            padding: 100px var(--photo-spacing) var(--photo-spacing);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--photo-spacing);
        }

        /* Square cells so vertical and horizontal photos show at the same
           size: each photo's long edge fills the cell, uncropped and centered */
        .photo {
            margin: 0;
            aspect-ratio: 1 / 1;
            display: grid;
            place-items: center;
            background-color: #f2f2f2;
        }

        .photo.loaded {
            background-color: transparent;
        }

        /* Wraps the image tightly so the caption sits on the photo itself */
        .photo-frame {
            position: relative;
            overflow: hidden;
        }

        .photo img {
            display: block;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .photo.loaded img {
            opacity: 1;
        }

        .photo figcaption {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 24px 12px 10px;
            color: white;
            font-size: 14px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }

        .photo:hover figcaption,
        .photo:focus-visible figcaption,
        .photo.show-caption figcaption {
            opacity: 1;
        }

        .gallery-empty {
            color: var(--text-color);
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- The title, menu, and moon are "logos": each holds two drawings that
         swap at random so hand-drawn versions look alive. These are
         placeholders; to use drawings, replace each pair with two <img>s
         that keep the class="logo-frame". -->

    <!-- Night mode toggle in the top right -->
    <button id="themeToggle" class="icon-button theme-toggle logo" type="button" aria-label="Night mode" aria-pressed="false">
        <svg class="logo-frame" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="logo-frame" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" transform="rotate(-12 12 12)"/></svg>
    </button>

    <!-- Menu button in the top left -->
    <button id="menuIcon" class="icon-button menu-icon logo" type="button" aria-label="Menu" aria-expanded="false">
        <svg class="logo-frame" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <svg class="logo-frame" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h17M2.5 12h18.5M4 17.5h16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
    </button>

    <!-- Site title -->
    <div class="header-container">
        <h1 class="site-title logo">
            <span class="logo-frame title-font-a">nathan.reichen</span>
            <span class="logo-frame title-font-b">nathan.reichen</span>
        </h1>
    </div>

    <!-- Sidebar menu -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-content">
            <a href="#" class="sidebar-link">Home</a>
            <a href="#film" class="sidebar-link">Film</a>
        </div>
    </nav>

    <!-- Film photos page, shown when the URL ends in #film -->
    <main id="film" class="gallery-page" hidden>
        <div id="photoGrid" class="photo-grid"></div>
        <div id="gallerySentinel"></div>
    </main>

    <!-- List of film photos; edit photos.js to add more -->
    <script src="photos.js"></script>
    <script>
        let isSidebarOpen = false;
        const menuIconElement = document.getElementById('menuIcon');
        const sidebarElement = document.getElementById('sidebar');

        // Function to toggle sidebar
        function toggleSidebar() {
            isSidebarOpen = !isSidebarOpen;
            menuIconElement.setAttribute('aria-expanded', isSidebarOpen);
            if (isSidebarOpen) {
                sidebarElement.classList.add('open');
                menuIconElement.classList.add('open');
            } else {
                sidebarElement.classList.remove('open');
                menuIconElement.classList.remove('open');
            }
        }

        // Add click event listener to menu icon
        menuIconElement.addEventListener('click', toggleSidebar);

        // Close the sidebar after picking a page
        document.querySelectorAll('.sidebar-link').forEach(function(link) {
            link.addEventListener('click', function() {
                if (isSidebarOpen) toggleSidebar();
            });
        });

        // ---- Night mode toggle ----
        const themeToggleElement = document.getElementById('themeToggle');
        const deviceDarkQuery = window.matchMedia('(prefers-color-scheme: dark)');

        // The visitor's choice wins; otherwise follow the device setting
        function isDarkMode() {
            const chosenTheme = document.documentElement.dataset.theme;
            return chosenTheme ? chosenTheme === 'dark' : deviceDarkQuery.matches;
        }

        function updateThemeToggle() {
            themeToggleElement.setAttribute('aria-pressed', isDarkMode());
        }

        themeToggleElement.addEventListener('click', function() {
            const newTheme = isDarkMode() ? 'light' : 'dark';
            document.documentElement.dataset.theme = newTheme;
            try {
                localStorage.setItem('theme', newTheme);
            } catch (e) {}
            updateThemeToggle();
        });

        deviceDarkQuery.addEventListener('change', updateThemeToggle);
        updateThemeToggle();

        // ---- Film page (photo gallery) ----
        const photos = window.PHOTOS || [];
        const PHOTOS_PER_BATCH = 8;
        const filmElement = document.getElementById('film');
        const photoGridElement = document.getElementById('photoGrid');
        const sentinelElement = document.getElementById('gallerySentinel');
        let photosShown = 0;
        let galleryStarted = false;
        let galleryObserver = null;

        // e.g. "Fall 2024 · Ann Arbor, MI", or "Fall 2024" with no location
        function captionFor(photo) {
            const when = [photo.season, photo.year].filter(Boolean).join(' ');
            return [when, photo.location].filter(Boolean).join(' · ');
        }

        function createPhotoElement(photo) {
            const caption = captionFor(photo);
            const figure = document.createElement('figure');
            figure.className = 'photo';
            figure.tabIndex = 0;

            const img = document.createElement('img');
            img.alt = caption ? 'Film photograph, ' + caption : 'Film photograph';
            img.decoding = 'async';
            const frame = document.createElement('div');
            frame.className = 'photo-frame';

            img.addEventListener('load', function() {
                // Size the frame to the photo's proportions, long edge filling the cell
                frame.style.aspectRatio = img.naturalWidth + ' / ' + img.naturalHeight;
                if (img.naturalWidth >= img.naturalHeight) {
                    frame.style.width = '100%';
                } else {
                    frame.style.height = '100%';
                }
                figure.classList.add('loaded');
            });
            img.addEventListener('error', function() {
                console.warn('Could not load photo:', photo.src);
                figure.remove();
            });
            img.src = photo.src;
            frame.appendChild(img);

            if (caption) {
                const figcaption = document.createElement('figcaption');
                figcaption.textContent = caption;
                frame.appendChild(figcaption);
            }
            figure.appendChild(frame);

            // Touch screens have no hover, so a tap toggles the caption
            figure.addEventListener('click', function() {
                figure.classList.toggle('show-caption');
            });
            return figure;
        }

        function showNextBatch() {
            const batch = photos.slice(photosShown, photosShown + PHOTOS_PER_BATCH);
            batch.forEach(function(photo) {
                photoGridElement.appendChild(createPhotoElement(photo));
            });
            photosShown += batch.length;

            if (photosShown >= photos.length) {
                galleryObserver.disconnect();
            } else {
                // Re-observe so a still-visible sentinel triggers the next batch
                galleryObserver.unobserve(sentinelElement);
                galleryObserver.observe(sentinelElement);
            }
        }

        function startGallery() {
            if (galleryStarted) return;
            galleryStarted = true;

            if (photos.length === 0) {
                photoGridElement.insertAdjacentHTML('afterend',
                    '<p class="gallery-empty">Film photos coming soon.</p>');
                return;
            }

            // Load the next batch once the bottom of the grid is near the screen
            galleryObserver = new IntersectionObserver(function(entries) {
                if (entries[0].isIntersecting) showNextBatch();
            }, { rootMargin: '800px 0px' });
            galleryObserver.observe(sentinelElement);
        }

        function showCurrentPage() {
            // #photography was the page's first address; keep old links working
            const onFilm = ['#film', '#photography'].includes(window.location.hash);
            filmElement.hidden = !onFilm;
            if (onFilm) startGallery();
        }

        window.addEventListener('hashchange', showCurrentPage);
        showCurrentPage();

        // ---- Logos ----
        // Each logo swaps between its two drawings on its own random timer.
        // Visitors who ask their device to reduce motion see them hold still.
        const LOGO_SWAP_MIN_MS = 300;
        const LOGO_SWAP_MAX_MS = 1500;

        function swapLogoLater(logo) {
            const delay = LOGO_SWAP_MIN_MS + Math.random() * (LOGO_SWAP_MAX_MS - LOGO_SWAP_MIN_MS);
            setTimeout(function() {
                logo.classList.toggle('show-alt');
                swapLogoLater(logo);
            }, delay);
        }

        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.querySelectorAll('.logo').forEach(swapLogoLater);
        }
    </script>
</body>
</html>
